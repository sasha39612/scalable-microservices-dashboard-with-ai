apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
data:
  # Base64 encoded PostgreSQL connection string.
  # Generate with: echo -n "postgresql://user:password@host:5432/microservices_dashboard" | base64
  # IMPORTANT: Replace with the real connection string before deployment.
  # See docs/REMOTE_DB_SETUP.md for provisioning the database.
  DATABASE_URL: cG9zdGdyZXNxbDovL1JFUExBQ0VfVVNFUjpSRVBMQUNFX1BBU1NXT1JEQFJFUExBQ0VfSE9TVDo1NDMyL21pY3Jvc2VydmljZXNfZGFzaGJvYXJk
stringData:
  # Shared secrets for gateway -> internal service calls. Services refuse to start in
  # production with an empty, short (<32 chars) or placeholder value.
  # Generate with: openssl rand -hex 32
  AI_SERVICE_API_KEY: "REPLACE-WITH-openssl-rand-hex-32"
  WORKER_SERVICE_API_KEY: "REPLACE-WITH-openssl-rand-hex-32"
